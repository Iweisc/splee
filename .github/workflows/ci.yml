name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Its own job, so lint and the tests run side by side instead of one after the other.
  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new stable clippy lint can't turn CI red on its own. Bump it here and in the backend job on purpose.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --all-targets -- -D warnings
      # The website chat script's pure functions. No packages needed.
      - run: node --test src/chat/widget.test.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: splee
          POSTGRES_PASSWORD: splee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # Migrating template1 once saves each of the hundreds of test databases its own run of every migration.
      - run: cargo run -q --example migrate
        env:
          DATABASE_URL: postgres://splee:splee@localhost:5432/template1
      # Includes the tests that need Postgres. They create and drop their own databases on this service.
      - run: cargo test -- --include-ignored
        env:
          DATABASE_URL: postgres://splee:splee@localhost:5432/postgres
      # Splee patches the vendored Claude SDK, and its own tests cover those patches.
      - run: cargo test -p claude-agent-sdk-rs --lib

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Catches what typecheck and lint can't, like a server page importing a client component that lost its "use client".
      - run: pnpm build
