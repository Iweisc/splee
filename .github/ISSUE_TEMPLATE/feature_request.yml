name: Feature request
description: Suggest something Splee should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you'd like it to work. Mockups and examples help.
