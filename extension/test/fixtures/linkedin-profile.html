<!doctype html>
<!-- A made-up person, in the shape of a signed-in LinkedIn profile. Kept small: only the parts the readers look at, plus noise around them. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>(3) Sam Lee | LinkedIn</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #f4f2ee; color: #191919; }
    .global-nav { height: 52px; background: #fff; border-bottom: 1px solid #e8e8e8; }
    main { max-width: 760px; margin: 24px auto; }
    section.artdeco-card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 8px; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.08); }
    .cover { height: 120px; margin: -24px -24px 16px; border-radius: 8px 8px 0 0; background: linear-gradient(90deg, #a7c4bc, #dfe7e3); }
    h1 { font-size: 24px; margin: 0; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .text-body-small { color: #666; font-size: 14px; }
    .pv-text-details__right-panel { list-style: none; padding: 0; margin: 8px 0 0; }
  </style>
</head>
<body>
  <header class="global-nav"><h1 class="visually-hidden">LinkedIn</h1></header>
  <main class="scaffold-layout__main">
    <section class="artdeco-card pv-top-card">
      <div class="cover"></div>
      <div class="pv-text-details__left-panel">
        <h1 class="text-heading-xlarge inline t-24 v-align-middle break-words">Sam Lee</h1>
        <div class="text-body-medium break-words" data-generated-suggestion-target="urn:li:fsu_profileActionDelegate">
          Head of Growth at Fieldnote | Field service software
        </div>
        <span class="text-body-small inline t-black--light break-words">Leeds, England, United Kingdom</span>
      </div>
      <ul class="pv-text-details__right-panel">
        <li>
          <button aria-label="Current company: Fieldnote. Click to skip to experience card" type="button">
            <span aria-hidden="true">Fieldnote</span><span class="visually-hidden">Fieldnote</span>
          </button>
        </li>
        <li><span aria-hidden="true">University of Leeds</span></li>
      </ul>
    </section>
    <section class="artdeco-card" id="experience">
      <h2>Experience</h2>
      <p><span aria-hidden="true">Head of Growth</span> · <span aria-hidden="true">Fieldnote</span></p>
      <p><span aria-hidden="true">Marketing Lead</span> · <span aria-hidden="true">Brightpath</span></p>
    </section>
  </main>
</body>
</html>
