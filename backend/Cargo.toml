[package]
name = "splee"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# A member so CI runs the vendored SDK's tests, which cover Splee's patches to it. Plain cargo commands here
# still only build and lint splee itself.
[workspace]
members = ["vendor/claude-agent-sdk-rs"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
argon2 = "0.5"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bech32 = "0.11.1"
calamine = "0.38.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
claude-agent-sdk-rs = "0.6.4"
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
hickory-resolver = { version = "0.26.3", features = ["tokio"] }
k256 = { version = "0.14.0", default-features = false, features = ["schnorr", "std"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "builder", "smtp-transport", "hostname", "ring", "rustls-native-certs"] }
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "gzip", "json", "multipart", "rustls"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-stream = "0.1.19"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zip = { version = "9.5.0", default-features = false }
parquet = { version = "60.1.0", default-features = false, features = ["async", "arrow", "zstd"] }
arrow-array = "60.1.0"
bytes = "1.12.1"

[dev-dependencies]
# Builds the small GeoParquet file the company import tests read.
arrow-schema = "60.1.0"

[patch.crates-io]
claude-agent-sdk-rs = { path = "vendor/claude-agent-sdk-rs" }
