services:
  db:
    image: postgres:17-alpine
    container_name: splee-db
    network_mode: bridge
    environment:
      POSTGRES_USER: splee
      POSTGRES_PASSWORD: splee
      POSTGRES_DB: splee
    ports:
      # Loopback only: the password above is public. Never publish this port on a server.
      - "127.0.0.1:55432:5432"
    volumes:
      - splee-db:/var/lib/postgresql/data
volumes:
  splee-db:
